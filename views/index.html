<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24HourGPT Backend</title>
    <link href="/output.css" rel="stylesheet" />
  </head>
  <body>
    <div
      class="min-h-screen bg-gray-900 flex flex-col justify-center items-center px-4"
    >
      <header class="text-center mb-8">
        <h1 class="text-5xl font-bold text-green-400 mb-2">Nucleus-bot</h1> <!-- Corrected spelling -->
        <p class="text-xl text-gray-300">An HQ for AI inference</p>
      </header>

      <main class="w-full max-w-md">
        <div class="bg-gray-800 shadow-lg rounded-lg p-6">
          <div id="inference-results" class="mb-4 h-64 overflow-y-auto text-gray-300">
            <!-- Inference results will be dynamically inserted here -->
          </div>

          <form id="inference-form" class="flex">
            <input
              type="text"
              id="model-input"
              class="flex-grow border border-gray-700 bg-gray-700 text-white rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
              placeholder="Enter your AI model input..."
            />
            <button
              type="submit"
              class="bg-green-500 text-white px-4 py-2 rounded-r-lg hover:bg-green-600 transition duration-300"
            >
              Run
            </button>
          </form>
        </div>
      </main>

      <footer class="mt-8 text-center text-gray-500">
        <p>© 2023 Nucleus-Bot. All rights reserved.</p>
      </footer>
    </div>

    <script>
      const inferenceForm = document.getElementById("inference-form");
      const modelInput = document.getElementById("model-input");
      const inferenceResults = document.getElementById("inference-results");

      inferenceForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const request = modelInput.value.trim();
        if (request) {
          appendMessage("Request", request);
          modelInput.value = "";

          try {
            const mistralResponse = await callApi("https://chrome-24hourgpt-5bb1bcb92d7e.herokuapp.com/mistral/chatbot", request);
            appendMessage("Mistral", mistralResponse);

            const chatResponse = await callApi("https://chrome-24hourgpt-5bb1bcb92d7e.herokuapp.com/chat/chatbot", request);
            appendMessage("Chat", chatResponse);
          } catch (error) {
            appendMessage("Error", `Failed to get a response: ${error.message}`);
          }
        }
      });

      function appendMessage(sender, text) {
        const messageElement = document.createElement("div");
        messageElement.className = "mb-2";
        messageElement.innerHTML = `<strong>${sender}:</strong> ${text}`;
        inferenceResults.appendChild(messageElement);
        inferenceResults.scrollTop = inferenceResults.scrollHeight;
      }

      async function callApi(url, request) {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ request }),
        });

        if (!response.ok) {
          throw new Error(`Network error: ${response.status} - ${response.statusText}`);
        }

        const data = await response.json();
        return data.response;
      }
    </script>
  </body>
</html>
